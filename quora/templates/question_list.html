
{% block content %}
<h2>All Questions</h2>
<ul>
    {% for question in questions %}
        <li>
            <a href="{% url 'question_detail' question.pk %}">{{ question.title }}</a><br>
            <small>by {{ question.user.username }} on {{ question.created_at }}</small>
        </li>
    {% empty %}
        <li>No questions yet.</li>
    {% endfor %}
</ul>
{% endblock %}
